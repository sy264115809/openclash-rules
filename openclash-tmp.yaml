  - RULE-SET,CustomUS,美国策略
  - RULE-SET,CustomJP,日本策略
  - RULE-SET,CustomTW,台湾策略
  - RULE-SET,CustomProxy,国外流量

  # 广告拦截
  - RULE-SET,Tracking,广告拦截
  - RULE-SET,Advertising,广告拦截
  
  # 本地/私有
  - RULE-SET,Private,DIRECT
  - RULE-SET,PrivateIP,DIRECT,no-resolve

